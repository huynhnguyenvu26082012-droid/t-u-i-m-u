<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mở Túi Mù Ngẫu Nhiên</title>
  <link rel="stylesheet" href="style.css">
  <!-- Thư viện Pháo hoa -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <div class="main-container">
    <h2>🎁 SHOP TÚI MÙ MAY MẮN 🎁</h2>
    <p class="sub-title">Chọn 1 trong các túi mù bên dưới để xé quà!</p>

    <!-- Ô nhập Mã Key -->
    <div class="input-box">
      <input type="text" id="inputKey" placeholder="Nhập mã Key (30k) vào đây..." autocomplete="off">
    </div>

    <!-- Lưới 6 Túi Mù -->
    <div class="blind-bag-grid">
      <div class="blind-bag" onclick="moTuiMu(1)">
        <div class="bag-icon">🎁</div>
        <div class="bag-text">TÚI #1</div>
      </div>
      <div class="blind-bag" onclick="moTuiMu(2)">
        <div class="bag-icon">🎁</div>
        <div class="bag-text">TÚI #2</div>
      </div>
      <div class="blind-bag" onclick="moTuiMu(3)">
        <div class="bag-icon">🎁</div>
        <div class="bag-text">TÚI #3</div>
      </div>
      <div class="blind-bag" onclick="moTuiMu(4)">
        <div class="bag-icon">🎁</div>
        <div class="bag-text">TÚI #4</div>
      </div>
      <div class="blind-bag" onclick="moTuiMu(5)">
        <div class="bag-icon">🎁</div>
        <div class="bag-text">TÚI #5</div>
      </div>
      <div class="blind-bag" onclick="moTuiMu(6)">
        <div class="bag-icon">🎁</div>
        <div class="bag-text">TÚI #6</div>
      </div>
    </div>
  </div>

  <!-- Popup Chúc Mừng & Thông Tin Acc -->
  <div id="resultModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <span class="close-btn" onclick="dongModal()">&times;</span>
      <div id="invoicePrint"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
